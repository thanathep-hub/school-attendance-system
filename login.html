<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<title>ระบบเช็คชื่อโรงเรียน — เข้าสู่ระบบ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<style>
/* Design tokens — Government Clean + Bai Jamjuree */
@import url('https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #F1F4FA;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --surface-3: #EEF2F7;
  --overlay: rgba(15, 23, 42, 0.45);
  --border: #E4E8F0;
  --border-strong: #CBD5E1;
  --divider: #EEF2F7;
  --text: #0B1F3F;
  --text-strong: #061226;
  --text-muted: #475569;
  --text-subtle: #94A3B8;
  --text-on-primary: #FFFFFF;
  --primary: #1E47A3;
  --primary-hover: #163680;
  --primary-active: #112B69;
  --primary-soft: #DCE6F8;
  --primary-soft-strong: #B7CAF0;
  --primary-tint: #F0F4FC;
  --accent: #B58A2B;
  --accent-soft: #FBF3DD;
  --present: #15803D;
  --present-soft: #DCFCE7;
  --present-strong: #166534;
  --absent: #B91C1C;
  --absent-soft: #FEE2E2;
  --absent-strong: #991B1B;
  --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-pill: 9999px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 2px 4px rgba(15, 23, 42, 0.05), 0 8px 24px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 8px 16px rgba(15, 23, 42, 0.06), 0 24px 48px rgba(15, 23, 42, 0.12);
  --shadow-xl: 0 32px 64px rgba(15, 23, 42, 0.18);
  --font-sans: 'Bai Jamjuree', 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.7, 0.25, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 120ms; --dur: 200ms; --dur-slow: 320ms;
}
:root[data-theme="dark"] {
  --bg: #0A1226; --surface: #121C36; --surface-2: #18254A; --surface-3: #1F2D5A;
  --overlay: rgba(0, 0, 0, 0.6); --border: #243260; --border-strong: #2F4180; --divider: #1B2647;
  --text: #E8EEFB; --text-strong: #FFFFFF; --text-muted: #A4B0CC; --text-subtle: #6E7CA3;
  --primary: #5B8DEF; --primary-hover: #7BA3F5; --primary-active: #4172D6;
  --primary-soft: #1B2F60; --primary-soft-strong: #25408A; --primary-tint: #142042;
  --accent: #E4C168; --accent-soft: #2A2418;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: var(--font-sans); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; color: inherit; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--r-md); border: 1px solid transparent; background: var(--surface-2); color: var(--text); font-size: 14px; font-weight: 500; line-height: 1; transition: background var(--dur) var(--ease); }
.btn:hover { background: var(--surface-3); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: transparent; border-color: var(--border-strong); }
.btn-outline:hover { background: var(--surface-2); }
.btn-ghost { background: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn-lg { height: 48px; padding: 0 22px; font-size: 15px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

@keyframes fade-in { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
@keyframes fade-in-no-y { from { opacity: 0; } to { opacity: 1; } }
.fade-in { animation: fade-in var(--dur-slow) var(--ease-out) both; }

/* ─── Login page ─── */
.login-page { min-height: 100vh; display: flex; background: var(--bg); }
.login-hero { flex: 1; min-width: 0; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-active) 100%); color: #fff; padding: 56px 60px; display: flex; align-items: center; position: relative; overflow: hidden; }
.login-hero::before { content: ''; position: absolute; top: -120px; right: -120px; width: 400px; height: 400px; background: rgba(255,255,255,0.06); border-radius: 50%; }
.login-hero::after { content: ''; position: absolute; bottom: -80px; left: -80px; width: 280px; height: 280px; background: rgba(255,255,255,0.04); border-radius: 50%; }
.login-hero-inner { position: relative; z-index: 1; max-width: 520px; }
.login-logo { width: 56px; height: 56px; border-radius: 14px; background: rgba(255,255,255,0.18); backdrop-filter: blur(4px); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; border: 1px solid rgba(255,255,255,0.25); flex-shrink: 0; }
.login-logo.small { width: 44px; height: 44px; font-size: 14px; background: var(--primary); border: none; color: #fff; }
.login-h1 { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 18px; }
.login-p { font-size: 15px; line-height: 1.7; margin: 0 0 30px; opacity: 0.88; max-width: 480px; }
.login-feat-list { list-style: none; padding: 0; margin: 0 0 36px; display: flex; flex-direction: column; gap: 10px; }
.login-feat-list li { font-size: 14px; display: flex; align-items: center; gap: 10px; opacity: 0.92; }
.login-feat-list .dot { width: 6px; height: 6px; background: #fff; border-radius: 50%; opacity: 0.7; }
.login-foot-meta { display: flex; gap: 10px; align-items: center; font-size: 12px; opacity: 0.7; }

.login-form-col { width: 520px; display: flex; align-items: center; justify-content: center; padding: 40px 32px; background: var(--surface); flex-shrink: 0; }
.login-form-wrap { width: 100%; max-width: 380px; }
.login-form-head { display: flex; gap: 14px; align-items: center; margin-bottom: 24px; }
.login-form-h { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
.login-form-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.login-quick { margin-bottom: 6px; }
.login-quick-l { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
.login-quick-grid { display: flex; flex-direction: column; gap: 6px; }
.login-quick-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; cursor: pointer; transition: all var(--dur); font-family: inherit; color: inherit; text-align: left; width: 100%; }
.login-quick-card:hover { background: var(--surface); border-color: var(--primary-soft-strong); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.login-quick-av { width: 32px; height: 32px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
.login-form { display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }
.login-role-tabs { display: flex; gap: 6px; }
.login-role-tabs button { flex: 1; padding: 10px 12px; font-size: 13px; font-weight: 500; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-muted); border-radius: 9px; cursor: pointer; font-family: inherit; transition: all var(--dur); }
.login-role-tabs button.active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-weight: 600; }
.field input { height: 44px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); font-family: inherit; font-size: 14px; outline: none; transition: all var(--dur); }
.field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.login-error { background: var(--absent-soft); color: var(--absent-strong); padding: 10px 12px; border-radius: 8px; font-size: 12px; line-height: 1.5; border-left: 3px solid var(--absent); }
.login-submit { margin-top: 4px; }
.login-meta-foot { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--divider); font-size: 11px; color: var(--text-muted); line-height: 1.6; }
.login-spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.desktop-only { display: block; }
.mobile-only { display: none; }

@media (max-width: 1023px) {
  .desktop-only { display: none !important; }
  .mobile-only { display: block; }
  .login-hero { display: none; }
  .login-form-col { flex: 1; width: 100%; max-width: 100%; padding: 32px 20px; }
  .login-form-wrap { max-width: 440px; }
}

</style>
<script>
  (function(){ try { var t = localStorage.getItem('v2_theme'); if (t==='dark') document.documentElement.setAttribute('data-theme','dark'); } catch(e){} })();
</script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
// ═════════════════════════════════════════════════════════
// Login Page — Standalone Version
// ═════════════════════════════════════════════════════════

const { useState, useEffect } = React;
const ReactDOM = window.ReactDOM;

// ─── School Data ─────────────────────────────────────────
const SCHOOL = {
  name: 'โรงเรียนบ้านหนองบัว',
  short: 'รร.บ้านหนองบัว',
  code: '1030200001',
  province: 'นครราชสีมา',
  district: 'เมืองนครราชสีมา',
  director: 'นางสมหญิง ใจดี',
  semester: 'ภาคเรียนที่ 2 ปีการศึกษา 2568',
  semesterShort: '2/2568',
};

// ─── API Configuration ──────────────────────────────────
// Google Apps Script Web App URL
// วิธีหา: เปิด Apps Script → Deploy → New deployment → Web app → Copy URL
// รูปแบบ: https://script.google.com/macros/s/AKfycb.../exec  (ลงท้ายด้วย /exec เท่านั้น)
const API_URL = 'https://script.google.com/macros/s/AKfycbzmhpAlkezFGSf15FEq6PrjBFTLW4_TEnRrHraW3WkdDrdsWe3qyttDr5LoFiXWj3SyKQ/exec';

// หรือ Node.js Server (ถ้าใช้ local development)
// const API_URL = 'http://localhost:5000/api';

// ─── SVG Icons ─────────────────────────────────────────
const ChevronRight = () => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ width: 18, height: 18 }}>
    <polyline points="9 6 15 12 9 18"/>
  </svg>
);

// ─── Session Management ─────────────────────────────────
function getSession() {
  try { return JSON.parse(localStorage.getItem('v2_session') || 'null'); } catch (e) { return null; }
}
function setSession(s) {
  try { if (s) localStorage.setItem('v2_session', JSON.stringify(s)); else localStorage.removeItem('v2_session'); } catch (e) {}
}

// ─── Main Login Component ─────────────────────────────
function LoginPage() {
  const [role, setRole] = useState('admin');
  const [username, setUsername] = useState('somying');
  const [password, setPassword] = useState('1234');
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);
  const [showQuick, setShowQuick] = useState(true);

  // ─── Helper: เรียก API ของ Apps Script ─────────────
  // หมายเหตุ: ใช้ Content-Type 'text/plain' เพื่อหลีกเลี่ยง CORS preflight
  //          (Apps Script Web App ไม่รองรับ preflight OPTIONS request)
  async function callApi(payload) {
    if (!API_URL || API_URL === 'PASTE_YOUR_DEPLOYMENT_URL_HERE') {
      throw new Error('ยังไม่ได้ตั้งค่า API_URL — โปรดดูในคู่มือ LOGIN_SETUP_GUIDE.md');
    }
    const response = await fetch(API_URL, {
      method: 'POST',
      mode: 'cors',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    if (!response.ok) {
      throw new Error('HTTP ' + response.status + ' ' + response.statusText);
    }
    return response.json();
  }

  async function doLogin(u, p, r) {
    setError(null);
    setLoading(true);
    try {
      const data = await callApi({ action: 'login', username: u, password: p, role: r });
      if (!data.success) {
        setError(data.message || 'Login failed');
        return;
      }
      setSession({ token: data.data.token, user: data.data.user });
      window.location.href = 'school-attendance-v2.html';
    } catch (err) {
      setError('Connection error: ' + err.message);
    } finally {
      setLoading(false);
    }
  }

  const submit = (e) => {
    if (e) e.preventDefault();
    if (!username || !password) {
      setError('กรุณากรอก username และรหัสผ่าน');
      return;
    }
    doLogin(username, password, role);
  };

  const quickLogin = (u, p, r) => doLogin(u, p, r);

  return (
    <div className="login-page">
      <div className="login-hero desktop-only">
        <div className="login-hero-inner">
          <div style={{ display: 'flex', gap: 14, alignItems: 'center', marginBottom: 28 }}>
            <div className="login-logo">รร</div>
            <div>
              <div style={{ fontSize: 13, fontWeight: 600, opacity: 0.9 }}>{SCHOOL.short}</div>
              <div style={{ fontSize: 11, opacity: 0.7 }}>{SCHOOL.semester}</div>
            </div>
          </div>
          <h1 className="login-h1">ระบบเช็คชื่อ<br/>นักเรียนออนไลน์</h1>
          <p className="login-p">
            ลดงานครูจากการเช็คชื่อบนกระดาษ และส่งใบลาด้วยมือ —
            ระบบส่ง LINE แจ้งผู้ปกครองให้อัตโนมัติ AI ตีความคำตอบเป็นใบลาให้
          </p>
          <ul className="login-feat-list">
            <li><span className="dot"/>เช็คชื่อบนมือถือ · เริ่มต้น "มา" ทุกคน</li>
            <li><span className="dot"/>ส่ง LINE หาผู้ปกครองอัตโนมัติ</li>
            <li><span className="dot"/>AI ตีความคำตอบ เปลี่ยนเป็นใบลาให้</li>
            <li><span className="dot"/>ส่งออก สพฐ. ในรูปแบบมาตรฐาน</li>
          </ul>
          <div className="login-foot-meta">
            <span>📞 0-4422-xxx-xxx</span>
            <span>·</span>
            <span>nongbua.school@go.th</span>
          </div>
        </div>
      </div>

      <div className="login-form-col">
        <div className="login-form-wrap">
          <div className="login-form-head">
            <div className="login-logo small">รร</div>
            <div>
              <h2 className="login-form-h">เข้าสู่ระบบ</h2>
              <div className="login-form-sub">{SCHOOL.name} · {SCHOOL.semester}</div>
            </div>
          </div>

          {showQuick && (
            <div className="login-quick">
              <div className="login-quick-l">Demo Accounts สำหรับทดสอบ</div>
              <div className="login-quick-grid">
                <button className="login-quick-card" onClick={() => { setRole('admin'); setUsername('somying'); setPassword('1234'); setShowQuick(false); }}>
                  <div className="login-quick-av" style={{ background: '#B58A2B' }}>สญ</div>
                  <div style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
                    <div style={{ fontSize: 13, fontWeight: 600 }}>นางสมหญิง ใจดี</div>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 1 }}>ผู้อำนวยการ</div>
                  </div>
                  <ChevronRight/>
                </button>
                <button className="login-quick-card" onClick={() => { setRole('teacher'); setUsername('porntip'); setPassword('1234'); setShowQuick(false); }}>
                  <div className="login-quick-av" style={{ background: '#1E47A3' }}>พท</div>
                  <div style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
                    <div style={{ fontSize: 13, fontWeight: 600 }}>ครูพรทิพย์ สวัสดี</div>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 1 }}>ครูประจำชั้น ป.3/1</div>
                  </div>
                  <ChevronRight/>
                </button>
                <button className="login-quick-card" onClick={() => { setRole('teacher'); setUsername('suda'); setPassword('1234'); setShowQuick(false); }}>
                  <div className="login-quick-av" style={{ background: '#B91C1C' }}>สด</div>
                  <div style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
                    <div style={{ fontSize: 13, fontWeight: 600 }}>ครูสุดา แสงดี</div>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 1 }}>ครูประจำชั้น ป.3/2</div>
                  </div>
                  <ChevronRight/>
                </button>
                <button className="login-quick-card" onClick={() => { setRole('teacher'); setUsername('pravit'); setPassword('1234'); setShowQuick(false); }}>
                  <div className="login-quick-av" style={{ background: '#15803D' }}>ปว</div>
                  <div style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
                    <div style={{ fontSize: 13, fontWeight: 600 }}>ครูประวิทย์ มากมี</div>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 1 }}>ครูประจำชั้น ป.4/1</div>
                  </div>
                  <ChevronRight/>
                </button>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, margin: '14px 0', fontSize: 11, color: 'var(--text-subtle)' }}>
                <span style={{ flex: 1, height: 1, background: 'var(--divider)' }}/>
                <span>หรือกรอกข้อมูลเอง</span>
                <span style={{ flex: 1, height: 1, background: 'var(--divider)' }}/>
              </div>
            </div>
          )}

          <form className="login-form" onSubmit={submit}>
            <div className="field">
              <label>บทบาท</label>
              <div className="login-role-tabs">
                <button type="button" className={role === 'admin' ? 'active' : ''} onClick={() => setRole('admin')}>👔 ผู้บริหาร</button>
                <button type="button" className={role === 'teacher' ? 'active' : ''} onClick={() => setRole('teacher')}>👨‍🏫 ครู</button>
              </div>
            </div>
            <div className="field">
              <label>Username</label>
              <input value={username} onChange={e => setUsername(e.target.value)} placeholder="username" autoComplete="username"/>
            </div>
            <div className="field">
              <label>รหัสผ่าน</label>
              <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" autoComplete="current-password"/>
            </div>
            {error && (<div className="login-error">{error}</div>)}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: 12 }}>
              <label style={{ display: 'flex', alignItems: 'center', gap: 6, color: 'var(--text-muted)', cursor: 'pointer' }}>
                <input type="checkbox" defaultChecked/> จดจำฉัน
              </label>
              <a style={{ color: 'var(--primary)', cursor: 'pointer' }}>ลืมรหัสผ่าน?</a>
            </div>
            <button type="submit" className="btn btn-primary btn-lg login-submit" disabled={loading}>
              {loading ? <span className="login-spinner"/> : 'เข้าสู่ระบบ'}
            </button>
          </form>

          <div className="login-meta-foot">
            ระบบสำหรับ <strong>ผู้บริหาร</strong> และ <strong>ครู</strong> ของ {SCHOOL.short} เท่านั้น<br/>
            <span style={{ color: 'var(--text-subtle)' }}>v2.0 · เซิร์ฟเวอร์: attend.school.go.th</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Render to DOM ─────────────────────────────────────
ReactDOM.render(
  <LoginPage />,
  document.getElementById('root')
);

</script>
</body>
</html>
