<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<title>ระบบเช็คชื่อโรงเรียน — รร.บ้านหนองบัว</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<style>
/* Design tokens — Government Clean + Bai Jamjuree
   See tokens.css notes. Slimmer copy for v2. */
@import url('https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #F1F4FA;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --surface-3: #EEF2F7;
  --overlay: rgba(15, 23, 42, 0.45);
  --border: #E4E8F0;
  --border-strong: #CBD5E1;
  --divider: #EEF2F7;
  --text: #0B1F3F;
  --text-strong: #061226;
  --text-muted: #475569;
  --text-subtle: #94A3B8;
  --text-on-primary: #FFFFFF;
  --primary: #1E47A3;
  --primary-hover: #163680;
  --primary-active: #112B69;
  --primary-soft: #DCE6F8;
  --primary-soft-strong: #B7CAF0;
  --primary-tint: #F0F4FC;
  --accent: #B58A2B;
  --accent-soft: #FBF3DD;
  --present: #15803D;
  --present-soft: #DCFCE7;
  --present-strong: #166534;
  --absent: #B91C1C;
  --absent-soft: #FEE2E2;
  --absent-strong: #991B1B;
  --leave: #B45309;
  --leave-soft: #FEF3C7;
  --leave-strong: #92400E;
  --late: #C2410C;
  --late-soft: #FFEDD5;
  --late-strong: #9A3412;
  --line: #06C755;
  --line-dark: #04A848;
  --line-bg: #8CABD8;
  --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-pill: 9999px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 2px 4px rgba(15, 23, 42, 0.05), 0 8px 24px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 8px 16px rgba(15, 23, 42, 0.06), 0 24px 48px rgba(15, 23, 42, 0.12);
  --shadow-xl: 0 32px 64px rgba(15, 23, 42, 0.18);
  --font-sans: 'Bai Jamjuree', 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.7, 0.25, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 120ms; --dur: 200ms; --dur-slow: 320ms;
}
:root[data-theme="dark"] {
  --bg: #0A1226; --surface: #121C36; --surface-2: #18254A; --surface-3: #1F2D5A;
  --overlay: rgba(0, 0, 0, 0.6); --border: #243260; --border-strong: #2F4180; --divider: #1B2647;
  --text: #E8EEFB; --text-strong: #FFFFFF; --text-muted: #A4B0CC; --text-subtle: #6E7CA3;
  --primary: #5B8DEF; --primary-hover: #7BA3F5; --primary-active: #4172D6;
  --primary-soft: #1B2F60; --primary-soft-strong: #25408A; --primary-tint: #142042;
  --accent: #E4C168; --accent-soft: #2A2418;
  --present: #4ADE80; --present-soft: #0F2B1A; --present-strong: #86EFAC;
  --absent: #F87171; --absent-soft: #2A1217; --absent-strong: #FCA5A5;
  --leave: #FBBF24; --leave-soft: #2A2010; --leave-strong: #FCD34D;
  --late: #FB923C; --late-soft: #2A1A10; --late-strong: #FDBA74;
  --line: #06C755; --line-bg: #1A2540;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.2);
  --shadow-md: 0 2px 4px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  --shadow-lg: 0 8px 16px rgba(0,0,0,.4), 0 24px 48px rgba(0,0,0,.5);
  --shadow-xl: 0 32px 64px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: var(--font-sans); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; color: inherit; }
.tnum { font-variant-numeric: tabular-nums; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--r-md); border: 1px solid transparent; background: var(--surface-2); color: var(--text); font-size: 14px; font-weight: 500; line-height: 1; transition: background var(--dur) var(--ease); }
.btn:hover { background: var(--surface-3); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: transparent; border-color: var(--border-strong); }
.btn-outline:hover { background: var(--surface-2); }
.btn-ghost { background: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--absent); color: #fff; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn-lg { height: 48px; padding: 0 22px; font-size: 15px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* Status pill */
.status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--r-pill); font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; }
.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status[data-s="present"] { background: var(--present-soft); color: var(--present-strong); }
.status[data-s="absent"]  { background: var(--absent-soft);  color: var(--absent-strong); }
.status[data-s="leave"]   { background: var(--leave-soft);   color: var(--leave-strong); }
.status[data-s="late"]    { background: var(--late-soft);    color: var(--late-strong); }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--text-muted); font-size: 12px; font-weight: 500; border: 1px solid var(--border); }
.chip.active { background: var(--text); color: var(--surface); border-color: var(--text); }
.chip.primary { background: var(--primary-soft); color: var(--primary); border-color: transparent; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }

@keyframes fade-in { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
@keyframes fade-in-no-y { from { opacity: 0; } to { opacity: 1; } }
.fade-in { animation: fade-in var(--dur-slow) var(--ease-out) both; }
@keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1);} 50% { opacity: 0.4; transform: scale(0.85);} }
.pulse-dot { animation: pulse-dot 1.4s ease-in-out infinite; }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* Hide scrollbars */
.scroll-y::-webkit-scrollbar, .scroll-x::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll-y::-webkit-scrollbar-thumb, .scroll-x::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
.scroll-y::-webkit-scrollbar-track, .scroll-x::-webkit-scrollbar-track { background: transparent; }

.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { scrollbar-width: none; }

</style>
<style>
/* layout.css — app shell + reusable components for v2 prototype */

/* ─── Shell ─── */
.app-shell { display: flex; min-height: 100vh; background: var(--bg); color: var(--text); }
.app-shell.is-mobile { flex-direction: column; }
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.main-content { flex: 1; overflow-y: auto; }

/* ─── Sidebar (desktop) ─── */
.sb { width: 244px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; height: 100vh; position: sticky; top: 0; }
.sb-brand { padding: 18px 18px 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sb-logo { width: 38px; height: 38px; border-radius: 9px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.sb-brand-nm { font-size: 14px; font-weight: 700; line-height: 1.25; }
.sb-brand-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.sb-scroll { flex: 1; overflow-y: auto; padding-bottom: 12px; }
.sb-section { padding: 14px 12px 4px; font-size: 11px; font-weight: 600; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.04em; }
.sb-link { display: flex; align-items: center; gap: 11px; padding: 9px 14px; margin: 1px 8px; border-radius: 9px; font-size: 14px; color: var(--text-muted); font-weight: 500; cursor: pointer; transition: all var(--dur); border: none; background: none; width: calc(100% - 16px); text-align: left; font-family: inherit; }
.sb-link:hover { background: var(--surface-2); color: var(--text); }
.sb-link.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.sb-link-icon { display: inline-flex; width: 19px; height: 19px; flex-shrink: 0; }
.sb-link-icon svg { width: 100%; height: 100%; }
.sb-badge { margin-left: auto; background: var(--absent); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; min-width: 18px; text-align: center; }
.sb-foot { padding: 12px 14px 14px; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
.sb-theme { display: flex; align-items: center; gap: 11px; padding: 8px 12px; background: var(--surface-2); border: none; border-radius: 8px; font-size: 13px; color: var(--text-muted); font-family: inherit; font-weight: 500; cursor: pointer; }
.sb-theme:hover { background: var(--surface-3); }
.sb-user { display: flex; gap: 10px; align-items: center; padding: 4px 4px; }
.sb-user-card { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 9px; }
.sb-user-card:hover { background: var(--surface-2); }
.sb-logout-btn { width: 32px; height: 32px; border: none; background: transparent; border-radius: 7px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: all var(--dur); }
.sb-logout-btn:hover { background: var(--absent-soft); color: var(--absent); }
.sb-logout-btn svg { width: 16px; height: 16px; }
.sb-user-nm { font-size: 13px; font-weight: 600; line-height: 1.25; }
.sb-user-role { font-size: 11px; color: var(--text-muted); }

/* ─── Mobile bottom-nav ─── */
.mob-tab { display: flex; background: var(--surface); border-top: 1px solid var(--border); padding: 4px 0 calc(8px + env(safe-area-inset-bottom)); position: sticky; bottom: 0; z-index: 10; }
.mob-tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; background: none; border: none; font-size: 11px; font-weight: 500; color: var(--text-subtle); font-family: inherit; }
.mob-tab-btn.active { color: var(--primary); }
.mob-tab-btn svg { width: 22px; height: 22px; }
.mob-tab-badge { position: absolute; top: -3px; right: -8px; background: var(--absent); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 99px; min-width: 16px; text-align: center; line-height: 1.3; }

/* ─── Mobile topbar ─── */
.mob-topbar { display: flex; align-items: center; padding: 14px 16px 12px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.mob-topbar-title { flex: 1; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.mob-topbar-btn { width: 34px; height: 34px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.mob-topbar-btn svg { width: 20px; height: 20px; }

/* ─── Sheet (bottom sheet) ─── */
.sheet-backdrop { position: fixed; inset: 0; background: var(--overlay); z-index: 100; animation: fade-in-no-y var(--dur) var(--ease-out); display: flex; align-items: flex-end; }
.sheet { width: 100%; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 0 calc(20px + env(safe-area-inset-bottom)); animation: sheet-up var(--dur-slow) var(--ease-out); max-height: 85vh; display: flex; flex-direction: column; }
.sheet-handle { width: 44px; height: 4px; background: var(--border-strong); border-radius: 99px; margin: 8px auto 14px; }
.sheet-title { font-size: 17px; font-weight: 700; padding: 0 20px 8px; }
.sheet-link { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: none; border: none; font-family: inherit; font-size: 15px; color: var(--text); cursor: pointer; text-align: left; }
.sheet-link:hover { background: var(--surface-2); }
.sheet-link.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.sheet-link svg { width: 20px; height: 20px; }

/* ─── Top bar (desktop) ─── */
.page-topbar { height: 56px; padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; flex-shrink: 0; position: sticky; top: 0; z-index: 5; }
.page-topbar .crumb { font-size: 13px; color: var(--text-muted); }
.page-topbar .crumb strong { color: var(--text); }
.page-topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.page-topbar-search { height: 36px; min-width: 240px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; display: flex; align-items: center; gap: 8px; }
.page-topbar-search input { flex: 1; height: 100%; border: none; outline: none; background: transparent; font-size: 13px; }
.page-topbar-icon-btn { width: 36px; height: 36px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); padding: 0; }
.page-topbar-icon-btn svg { width: 18px; height: 18px; }
.page-topbar-icon-btn:hover { background: var(--surface-3); color: var(--text); }

/* ─── Page header ─── */
.page-header { padding: 24px 28px 16px; display: flex; align-items: center; gap: 16px; }
.page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; margin: 0; line-height: 1.2; }
.page-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.page-actions { display: flex; gap: 8px; align-items: center; }

@media (max-width: 768px) {
  .page-header { padding: 16px 16px 12px; }
  .page-title { font-size: 19px; }
}

/* ─── Panel + cards ─── */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.panel-head { padding: 14px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
.panel-head h2 { font-size: 15px; font-weight: 700; margin: 0; }
.panel-head .sub { font-size: 12px; color: var(--text-muted); margin-left: 4px; padding-left: 10px; border-left: 1px solid var(--border); }
.panel-head .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.panel-body { padding: 16px 18px; }
.panel-body.flush { padding: 0; }

/* ─── KPI cards ─── */
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; position: relative; overflow: hidden; }
.kpi .lab { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.kpi .val { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.kpi .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* Avatar */
.avatar-sm { width: 28px; height: 28px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }

/* List row */
.list-row { padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--divider); transition: background var(--dur); cursor: pointer; }
.list-row:last-child { border-bottom: none; }
.list-row:hover { background: var(--surface-2); }
.list-row.active { background: var(--primary-soft); }

/* ─── Responsive overrides ─── */
.desktop-only { display: block; }
.mobile-only { display: none; }
@media (max-width: 1023px) {
  .desktop-only { display: none !important; }
  .mobile-only { display: block; }
  .app-shell { flex-direction: column; }
}

</style>
<style>
/* components.css — page-specific styles for v2 */

/* ─── Common page wrap ─── */
.page-body { display: flex; flex-direction: column; }

/* ─── Home page ─── */
.home-wrap { padding: 0 28px 32px; }
.home-welcome { display: flex; gap: 14px; align-items: center; padding: 4px 0 22px; }
.welcome-av { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-active)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; flex-shrink: 0; }
.welcome-h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.welcome-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.home-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.home-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.quick-card { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all var(--dur); text-align: left; font-family: inherit; color: inherit; }
.quick-card:hover { background: var(--surface); border-color: var(--primary-soft-strong); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.qc-icon { width: 36px; height: 36px; border-radius: 9px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.qc-icon svg { width: 18px; height: 18px; }
.qc-icon.present { background: var(--present-soft); color: var(--present-strong); }
.qc-icon.line { background: rgba(6, 199, 85, 0.15); color: var(--line); }
.qc-nm { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.qc-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.dot-red { display: inline-block; width: 6px; height: 6px; background: var(--absent); border-radius: 50%; }

.feed-mini { display: flex; flex-direction: column; }
.feed-mini-row { display: flex; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--divider); align-items: flex-start; }
.feed-mini-row:last-child { border-bottom: none; }
.feed-mini-dot { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.feed-mini-dot svg { width: 14px; height: 14px; }
.feed-mini-dot.warn { background: var(--absent-soft); color: var(--absent); }
.feed-mini-dot.info { background: var(--leave-soft); color: var(--leave); }
.feed-mini-h { font-size: 13px; font-weight: 500; }
.feed-mini-b { font-size: 11px; color: var(--text-muted); margin-top: 1px; line-height: 1.4; }
.feed-mini-t { font-size: 11px; color: var(--text-subtle); flex-shrink: 0; white-space: nowrap; }
.see-more-btn { width: 100%; padding: 10px; background: var(--surface-2); border: none; color: var(--primary); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border-top: 1px solid var(--border); }

@media (max-width: 1023px) {
  .home-wrap { padding: 12px 16px 16px; }
  .home-kpis { grid-template-columns: repeat(2, 1fr); }
  .home-grid { grid-template-columns: 1fr; }
}

/* ─── Dashboard ─── */
.dashboard-wrap { padding: 0 28px 32px; }
.dashboard-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.dashboard-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.kpi-alert { background: linear-gradient(135deg, var(--absent-soft) 0%, var(--surface) 70%); border-color: color-mix(in srgb, var(--absent) 18%, transparent); }
.kpi-alert .val { color: var(--absent); }
.quota-bar { height: 5px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.quota-bar > div { height: 100%; background: var(--primary); border-radius: 99px; }

.room-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 14px 18px; }
.room { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer; transition: all var(--dur); }
.room:hover { border-color: var(--primary-soft-strong); background: var(--surface); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.room-nm { font-size: 14px; font-weight: 700; }
.room-t { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
.room-r { display: flex; align-items: baseline; gap: 4px; margin-top: 10px; }
.room-r .a { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.room-r .b { font-size: 11px; color: var(--text-muted); }
.room-r .ok { margin-left: auto; font-size: 11px; color: var(--present-strong); font-weight: 600; }
.room-r .bad-n { margin-left: auto; font-size: 11px; color: var(--absent); font-weight: 600; }
.pct-bar { height: 4px; background: var(--border); border-radius: 99px; margin-top: 7px; overflow: hidden; }
.pct-bar > div { height: 100%; background: var(--present); border-radius: 99px; transition: width var(--dur-slow) var(--ease-out); }

/* ─── Modal ─── */

.modal-head-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.modal-head-icon svg { width: 18px; height: 18px; }
.modal-head h3 { margin: 0 0 2px; font-size: 17px; font-weight: 700; }
.modal-head .sub { font-size: 13px; color: var(--text-muted); }
.modal-close { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--surface-2); cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
.modal-close svg { width: 16px; height: 16px; }
.modal-body { padding: 18px 22px; overflow-y: auto; flex: 1; }
.modal-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; background: var(--surface-2); align-items: center; }

.ai-card { background: var(--primary-tint); border: 1px solid var(--primary-soft-strong); border-radius: 10px; padding: 12px; margin-bottom: 14px; }
.ai-card-l { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }

.ta-wrap { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); transition: border-color var(--dur); }
.ta-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.ta-wrap textarea { width: 100%; min-height: 130px; border: none; outline: none; background: transparent; padding: 12px 14px; font-family: inherit; font-size: 14px; line-height: 1.55; color: var(--text); resize: vertical; }
.ta-tools { display: flex; align-items: center; gap: 8px; padding: 4px 8px 8px; border-top: 1px solid var(--divider); }
.preview-line-bubble { background: var(--line); color: #fff; border-radius: 18px 18px 4px 18px; padding: 10px 14px; font-size: 13px; line-height: 1.55; max-width: 320px; box-shadow: var(--shadow-sm); white-space: pre-wrap; }

/* ─── Students page ─── */
.students-layout { display: grid; grid-template-columns: 360px 1fr; gap: 16px; padding: 0 28px 32px; }

/* ─── Attendance ─── */

.att-filters { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; align-items: center; border-bottom: 1px solid var(--divider); }

.att-search { display: flex; align-items: center; gap: 8px; height: 38px; margin: 12px 16px 4px; padding: 0 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; }
.att-search input { flex: 1; border: none; outline: none; background: transparent; font-size: 14px; }
.att-search svg { width: 14px; height: 14px; color: var(--text-subtle); }
.att-list { flex: 1; }
.att-row { padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--divider); background: var(--surface); }
.att-row.alert { background: linear-gradient(90deg, color-mix(in srgb, var(--absent) 6%, var(--surface)), var(--surface) 40%); }
.att-no { width: 28px; text-align: center; font-size: 13px; font-weight: 600; color: var(--text-muted); flex-shrink: 0; }

.att-name-n { font-size: 14px; font-weight: 500; line-height: 1.3; }
.att-name-m { font-size: 11px; color: var(--text-subtle); margin-top: 2px; }

.seg-control { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 0; flex-shrink: 0; border: 1px solid var(--border); }
.seg-btn { width: 38px; height: 30px; border: none; background: transparent; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--text-subtle); transition: all var(--dur); padding: 0; font-family: inherit; }

.seg-btn[data-active="true"][data-s="present"] { color: var(--present-strong); }
.seg-btn[data-active="true"][data-s="absent"]  { color: var(--absent-strong); background: var(--absent-soft); }
.seg-btn[data-active="true"][data-s="leave"]   { color: var(--leave-strong); background: var(--leave-soft); }

.att-note-row { padding: 0 16px 10px; background: var(--surface); border-bottom: 1px solid var(--divider); }
.att-note-row input { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); font-size: 13px; outline: none; font-family: inherit; }
.att-cta-dock { position: sticky; bottom: 0; left: 0; right: 0; padding: 12px 16px 16px; background: linear-gradient(to top, var(--surface) 60%, transparent); margin-top: auto; }

.att-success { position: fixed; inset: 0; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; z-index: 200; animation: fade-in var(--dur-slow) var(--ease-out); }
.att-success-check { width: 96px; height: 96px; background: var(--present-soft); color: var(--present-strong); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }

.chat-head { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.btn-icon-32 { width: 36px; height: 36px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.ai-banner { background: var(--primary-tint); color: var(--text); padding: 8px 14px; font-size: 12px; border-bottom: 1px solid var(--primary-soft-strong); display: flex; gap: 6px; align-items: center; }

function useMediaQuery(q) {
  const get = () => typeof window !== 'undefined' && window.matchMedia(q).matches;
  const [m, setM] = useState(get);
  useEffect(() => {
    const mql = window.matchMedia(q);
    const onChange = () => setM(mql.matches);
    mql.addEventListener('change', onChange);

}

  const [theme, setT] = useState(() => {
    try { return localStorage.getItem('v2_theme') || 'light'; } catch (e) { return 'light'; }
  });
  useEffect(() => {
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

  }, [theme]);
  return [theme, setT];
}

  const parse = () => {
    const h = (location.hash || '').replace('#/', '').replace('#', '');
    const [path, query] = h.split('?');
    return { path: path || initial, params: new URLSearchParams(query || '') };

    const onH = () => setRouteRaw(parse());

  }, []);

    let h = '#/' + path;
    if (params) {

}

// ─── Expose to other babel scripts ─────
Object.assign(window, {
  useMediaQuery, useTheme, useHashRoute,
  ICONS, Avatar, NAV_ITEMS,

// ─── Session helpers (window-scoped) ───
function getSession() {
  try { return JSON.parse(localStorage.getItem('v2_session') || 'null'); } catch (e) { return null; }
}
function setSession(s) {
  try { if (s) localStorage.setItem('v2_session', JSON.stringify(s)); else localStorage.removeItem('v2_session'); } catch (e) {}
}

// ─── useSession hook ───
function useSession() {
  const [session, setSessionState] = useState_L(() => getSession());
  const login = (user) => { setSession(user); setSessionState(user); };
  const logout = () => { setSession(null); setSessionState(null); try { location.hash = ''; } catch(e){} };
  return [session, login, logout];
}

          </div>
        </div>

      <div className="login-form-col">

function TrendChart() {
  const days = ['จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'จ.', 'อ.'];
  const present = [178, 182, 175, 180, 183, 181, 184];
  const absent  = [9, 5, 12, 7, 4, 6, 3];
  const W = 700, H = 200, pad = { l: 36, r: 16, t: 12, b: 28 };
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b;
  const x = (i) => pad.l + (i * innerW) / (days.length - 1);
  const yP = (v) => pad.t + innerH * (1 - (v / 187));
  const yA = (v) => pad.t + innerH * (1 - (v / 25));
  const linePath = (arr, scale) => arr.map((v, i) => `${i?'L':'M'}${x(i)} ${scale(v)}`).join(' ');
  const areaPath = `${linePath(present, yP)} L${x(days.length-1)} ${pad.t+innerH} L${x(0)} ${pad.t+innerH} Z`;

  return (
    <div style={{ padding: '14px 18px 18px' }}>
      <div style={{ display: 'flex', gap: 16, fontSize: 12, color: 'var(--text-muted)', marginBottom: 8 }}>
        <span><span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: '50%', background: 'var(--present)', marginRight: 4, verticalAlign: 'middle' }}/>มาเรียน</span>
        <span><span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: '50%', background: 'var(--absent)', marginRight: 4, verticalAlign: 'middle' }}/>ขาด/ลา/สาย</span>
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block' }}>
        {[0, 0.5, 1].map(t => (<line key={t} x1={pad.l} x2={W-pad.r} y1={pad.t + innerH*(1-t)} y2={pad.t + innerH*(1-t)} stroke="var(--border)" strokeDasharray="2 4"/>))}
        <path d={areaPath} fill="var(--present-soft)" opacity="0.6"/>
        <path d={linePath(present, yP)} fill="none" stroke="var(--present)" strokeWidth="2.5" strokeLinejoin="round"/>
        {present.map((v, i) => <circle key={i} cx={x(i)} cy={yP(v)} r="3.5" fill="var(--surface)" stroke="var(--present)" strokeWidth="2"/>)}
        <path d={linePath(absent, yA)} fill="none" stroke="var(--absent)" strokeWidth="2" strokeDasharray="4 4"/>
        {absent.map((v, i) => <circle key={i} cx={x(i)} cy={yA(v)} r="3" fill="var(--absent)"/>)}
        {days.map((d, i) => <text key={i} x={x(i)} y={H - 8} textAnchor="middle" fontSize="11" fill="var(--text-subtle)">{d}</text>)}
        {[187, 93, 0].map((v, i) => <text key={i} x={pad.l - 8} y={pad.t + innerH*(i/2) + 4} textAnchor="end" fontSize="10" fill="var(--text-subtle)">{v}</text>)}
      </svg>
    </div>
  );
}

function ContactAIModal({ student, onClose }) {

      setRegen(false);
    }, 800);

  if (sent) return (

      <div className="modal" onClick={e => e.stopPropagation()}>

function StudentsPage({ navigate, route, isMobile }) {
  const [filter, setFilter] = useState_M('all');

  const [classFilter, setClassFilter] = useState_M('all');
  const selectedId = route.params.get('id');

  const list = useMemo_M(() => {
    let r = window.D.ALL_STUDENTS;
    if (classFilter !== 'all') r = r.filter(s => s.classroomId === classFilter);
    if (filter === 'alert') r = r.filter(s => s.alert);
    if (filter === 'today') r = r.filter(s => s.alert || s.no <= 5);
    if (q) r = r.filter(s => (s.fname + s.lname).includes(q) || String(s.no).includes(q));
    return r;
  }, [filter, q, classFilter]);

  const selected = selectedId ? window.D.getStudent(selectedId) : list[0];

  // On mobile, when a student selected → show only detail
  const showDetailOnMobile = isMobile && selectedId;
  const showListOnMobile = isMobile && !selectedId;

  return (
    <div className="page-body">
      {!showDetailOnMobile && <PageHeader title="นักเรียน" subtitle={`${list.length} จาก ${window.D.ALL_STUDENTS.length} คน`}/>}

                {window.D.CLASSROOMS.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              <div className="filter-tabs">
                <button className={filter==='all'?'active':''} onClick={() => setFilter('all')}>ทั้งหมด</button>

                <button className={filter==='alert'?'active':''} onClick={() => setFilter('alert')}>ต้องติดตาม</button>
              </div>
            </div>
            <div className="students-list scroll-y">
              {list.map(s => {
                const cls = window.D.getClass(s.classroomId);

                <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 2, display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                  <span>{parent.relation}</span>·
                  <span className="tnum">{parent.phone}</span>·
                  {parent.lineLinked
                    ? <span style={{ background: 'var(--line)', color: '#fff', padding: '1px 8px', borderRadius: 99, fontSize: 10, fontWeight: 600 }}>LINE เชื่อมแล้ว</span>
                    : <span style={{ background: 'var(--leave-soft)', color: 'var(--leave-strong)', padding: '1px 8px', borderRadius: 99, fontSize: 10, fontWeight: 600 }}>รอเชื่อม LINE</span>}
                </div>
              </div>
              <button className="btn btn-sm btn-outline">{window.ICONS.msg} แชต</button>
            </div>
          ) : (
            <div style={{ padding: 18, textAlign: 'center', color: 'var(--text-muted)', fontSize: 13 }}>ยังไม่มีผู้ปกครองในระบบ · <a style={{ color: 'var(--primary)', cursor: 'pointer' }}>+ เพิ่ม</a></div>
          )}
        </div>
      </div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════
//  ATTENDANCE PAGE — mobile-fullscreen + desktop layout
// ═════════════════════════════════════════════════════════
function AttendancePage({ navigate, isMobile }) {
  // Period selection
  const [periodIdx, setPeriodIdx] = useState_M(1); // start at current period (idx 1)
  // Statuses + notes
  const [statuses, setStatuses] = useState_M(() => {
    const init = {}; window.D.STUDENTS_P3_1.forEach(s => { init[s.no] = 'present'; }); return init;
  });
  const [notes, setNotes] = useState_M({});
  const [filter, setFilter] = useState_M('all');
  const [query, setQuery] = useState_M('');
  const [showSend, setShowSend] = useState_M(false);
  const [success, setSuccess] = useState_M(null);

  const period = window.D.TODAY_SCHEDULE[periodIdx];
  const subject = period?.subject;

  const counts = useMemo_M(() => {
    const c = { present: 0, absent: 0, leave: 0, late: 0 };
    Object.values(statuses).forEach(s => c[s]++);
    return c;
  }, [statuses]);
  const notPresent = counts.absent + counts.leave + counts.late;

  const filtered = window.D.STUDENTS_P3_1.filter(s => {
    if (filter !== 'all' && statuses[s.no] !== filter) return false;
    if (query && !(`${s.fname} ${s.lname} ${s.no}`).includes(query)) return false;
    return true;
  });

  const setStatus = (no, st) => setStatuses(p => ({ ...p, [no]: st }));
  const setNote = (no, n) => setNotes(p => ({ ...p, [no]: n }));
  const resetAll = () => {
    const init = {}; window.D.STUDENTS_P3_1.forEach(s => { init[s.no] = 'present'; });
    setStatuses(init); setNotes({});
  };
  const flagged = window.D.STUDENTS_P3_1.filter(s => statuses[s.no] !== 'present');

  return (
    <div className={`attendance-page ${isMobile ? 'mobile' : ''}`}>
      {/* Header */}
      <div className="att-header">
        {isMobile && (
          <button className="att-back" onClick={() => navigate('home')}>{window.ICONS.chevL}</button>
        )}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="att-title">เช็คชื่อ · ป.3/1</div>
          <div className="att-sub">{window.D.SCHOOL.todayLabel.split(' ').slice(-3).join(' ')} · 25 คน</div>
        </div>
        <select className="att-period-select" value={periodIdx} onChange={e => setPeriodIdx(+e.target.value)}>
          {window.D.TODAY_SCHEDULE.map((p, i) => (
            <option key={i} value={i}>
              คาบ {p.period} · {p.subject} {p.completed ? '✓' : p.current ? '· กำลังเรียน' : ''}
            </option>
          ))}
        </select>
      </div>

      {/* Progress bar */}
      <div className="att-progress">
        <div className="att-progress-bar">
          {counts.present > 0 && <div className="seg" style={{ flex: counts.present, background: 'var(--present)' }}/>}
          {counts.absent > 0 && <div className="seg" style={{ flex: counts.absent, background: 'var(--absent)' }}/>}
          {counts.leave > 0 && <div className="seg" style={{ flex: counts.leave, background: 'var(--leave)' }}/>}
          {counts.late > 0 && <div className="seg" style={{ flex: counts.late, background: 'var(--late)' }}/>}
        </div>
        <div className="att-counts">
          <span className="item"><span className="d" style={{ background: 'var(--present)' }}/><span className="n tnum">{counts.present}</span> มา</span>
          <span className="item"><span className="d" style={{ background: 'var(--absent)' }}/><span className="n tnum">{counts.absent}</span> ขาด</span>
          <span className="item"><span className="d" style={{ background: 'var(--leave)' }}/><span className="n tnum">{counts.leave}</span> ลา</span>
          <span className="item"><span className="d" style={{ background: 'var(--late)' }}/><span className="n tnum">{counts.late}</span> สาย</span>
        </div>
      </div>

      {/* Filter chips + bulk + search */}
      <div className="att-filters scroll-x no-scrollbar">
        <button className={`chip ${filter==='all'?'active':''}`} onClick={() => setFilter('all')}>ทั้งหมด · {window.D.STUDENTS_P3_1.length}</button>
        <button className={`chip ${filter==='absent'?'active':''}`} onClick={() => setFilter(filter==='absent'?'all':'absent')}>ขาด · {counts.absent}</button>
        <button className={`chip ${filter==='leave'?'active':''}`} onClick={() => setFilter(filter==='leave'?'all':'leave')}>ลา · {counts.leave}</button>
        <button className={`chip ${filter==='late'?'active':''}`} onClick={() => setFilter(filter==='late'?'all':'late')}>สาย · {counts.late}</button>
        <span style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
          <button className="chip" onClick={resetAll}>{window.ICONS.refresh} รีเซ็ต</button>
        </span>
      </div>

      <div className="att-info-bar">
        เริ่มต้น: ทุกคน "มา" — แตะปุ่มเปลี่ยนเฉพาะคนที่ไม่ได้มา · ส่ง LINE เฉพาะ ≠ "มา"
      </div>

      <div className="att-search">
        {window.ICONS.search}
        <input value={query} onChange={e => setQuery(e.target.value)} placeholder="ค้นหาเลขที่หรือชื่อ…"/>
      </div>

      {/* Student rows */}
      <div className="att-list scroll-y">
        {filtered.length === 0 ? (
          <div style={{ padding: 60, textAlign: 'center', color: 'var(--text-subtle)' }}>ไม่พบนักเรียนตามเงื่อนไข</div>
        ) : filtered.map(s => (
          <StudentAttRow key={s.no} student={s} status={statuses[s.no]} note={notes[s.no] || ''}
            setStatus={(st) => setStatus(s.no, st)} setNote={(n) => setNote(s.no, n)}/>
        ))}
      </div>

      {/* CTA dock */}
      <div className="att-cta-dock">
        <button className="att-cta" disabled={notPresent === 0 && !window.D.STUDENTS_P3_1.find(s => statuses[s.no] !== 'present')}
          onClick={() => setShowSend(true)}>
          {window.ICONS.send}
          {notPresent === 0
            ? 'ทุกคนมาครบ — บันทึก'
            : <>บันทึก & ส่ง LINE <span className="badge tnum">{notPresent} คน</span></>}
        </button>
      </div>

      {showSend && (
        <SendConfirmSheet flagged={flagged} statuses={statuses} period={period}
          onClose={() => setShowSend(false)}
          onConfirm={() => { setShowSend(false); setSuccess({ counts, period, flagged: flagged.length }); }}/>
      )}
      {success && <AttSuccessOverlay data={success} onClose={() => { setSuccess(null); navigate('home'); }}/>}
    </div>
  );
}

function StudentAttRow({ student, status, note, setStatus, setNote }) {
  const showNote = status === 'leave' || status === 'absent';
  return (
    <>
      <div className={`att-row ${student.alert ? 'alert' : ''}`}>
        <div className="att-no tnum">{String(student.no).padStart(2, '0')}</div>
        <div className="att-name">
          <div className="att-name-n">{student.prefix}{student.fname} {student.lname}</div>
          {student.alert
            ? <div className="att-name-m warn">⚠ ขาดติดต่อกัน {student.absentStreak} วัน</div>
            : status !== 'present' && <div className="att-name-m">จะแจ้งผู้ปกครองทาง LINE</div>}
        </div>
        <div className="seg-control">
          {['present', 'absent', 'leave', 'late'].map(s => (
            <button key={s} className="seg-btn" data-s={s} data-active={status === s} onClick={() => setStatus(s)}>
              {{ present: 'มา', absent: 'ขาด', leave: 'ลา', late: 'สาย' }[s]}
            </button>
          ))}
        </div>
      </div>
      {showNote && (
        <div className="att-note-row fade-in">
          <input placeholder={status === 'leave' ? 'เหตุผลที่ลา (เช่น ป่วย, ลากิจ)' : 'หมายเหตุ (ไม่บังคับ)'}
            value={note} onChange={e => setNote(e.target.value)}/>
        </div>
      )}
    </>
  );
}

function SendConfirmSheet({ flagged, statuses, period, onClose, onConfirm }) {
  return (
    <div className="sheet-backdrop" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheet-handle"/>
        <div className="sheet-title">ยืนยันการส่งแจ้งเตือน</div>
        <div style={{ fontSize: 13, color: 'var(--text-muted)', padding: '0 20px 12px' }}>
          ระบบจะส่ง LINE หาผู้ปกครอง {flagged.length} คน (เฉพาะคนที่ไม่ได้มา)
        </div>
        <div style={{ padding: '0 20px', overflow: 'auto', flex: 1 }}>
          <div style={{ background: 'var(--primary-tint)', border: '1px solid var(--primary-soft-strong)', borderRadius: 10, padding: 10, fontSize: 12, color: 'var(--primary)', marginBottom: 8 }}>
            ใช้โควต้า LINE {flagged.length} ข้อความ · เหลือ {window.D.SCHOOL.lineQuotaTotal - window.D.SCHOOL.lineQuotaUsed - flagged.length} ข้อความเดือนนี้
          </div>
          <div style={{ background: 'var(--surface-2)', borderRadius: 10, padding: 4 }}>
            {flagged.map(s => (
              <div key={s.no} style={{ padding: '10px 12px', display: 'flex', alignItems: 'center', gap: 10, fontSize: 13, borderBottom: '1px solid var(--divider)' }}>
                <span className="tnum" style={{ width: 24, color: 'var(--text-subtle)', fontSize: 12 }}>{s.no}</span>
                <span style={{ flex: 1 }}>{s.prefix}{s.fname} {s.lname}</span>
                <span className="status" data-s={statuses[s.no]}>{{ absent: 'ขาด', leave: 'ลา', late: 'สาย' }[statuses[s.no]]}</span>
              </div>
            ))}
          </div>
        </div>
        <div style={{ padding: '14px 20px 0', display: 'flex', gap: 8 }}>
          <button className="btn btn-outline" style={{ flex: 1 }} onClick={onClose}>กลับไปแก้</button>
          <button className="btn btn-primary" style={{ flex: 1 }} onClick={onConfirm}>{window.ICONS.send} ส่งเลย</button>
        </div>
      </div>
    </div>
  );
}

function AttSuccessOverlay({ data, onClose }) {
  useEffect_M(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  return (
    <div className="att-success">
      <div className="att-success-check fade-in">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2>บันทึกเรียบร้อย</h2>
      <p>ส่ง LINE แจ้งผู้ปกครอง {data.flagged} คน<br/>คาบ {data.period.period} · {data.period.subject}</p>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, width: 280, marginTop: 24 }}>
        <div className="att-success-stat"><div className="n tnum" style={{ color: 'var(--present)' }}>{data.counts.present}</div><div className="l">มา</div></div>
        <div className="att-success-stat"><div className="n tnum" style={{ color: 'var(--absent)' }}>{data.counts.absent + data.counts.leave + data.counts.late}</div><div className="l">ไม่มา</div></div>
      </div>
    </div>
  );
}

Object.assign(window, { HomePage, DashboardPage, StudentsPage, AttendancePage });

</script>
  <script type="text/babel">
// pages-secondary.jsx — Classrooms, Parents/LINE, Reports, Notifications, Settings

const { useState: useState_S, useMemo: useMemo_S, useEffect: useEffect_S, useRef: useRef_S } = React;

                {['จ', 'อ', 'พ', 'พฤ', 'ศ'].map((d, dayIdx) => (

// ═════════════════════════════════════════════════════════
//  PARENTS · LINE — chat list + chat view
// ═════════════════════════════════════════════════════════
function ParentsPage({ navigate, route, isMobile }) {
  const selectedId = route.params.get('id');
  const showList = !isMobile || !selectedId;
  const showChat = !isMobile || selectedId;
  const parent = selectedId ? window.D.getParent(selectedId) : window.D.PARENTS[0];

  return (
    <div className="page-body">
      {showList && !isMobile && <PageHeader title="ผู้ปกครอง · LINE" subtitle={`${window.D.PARENTS.length} ครอบครัว · ${window.D.PARENTS.filter(p => p.lineLinked).length} เชื่อม LINE แล้ว`}/>}
      <div className={`parents-layout ${isMobile ? 'mobile' : ''}`}>
        {showList && <ParentsList active={parent?.id} navigate={navigate} isMobile={isMobile}/>}
        {showChat && parent && <ParentChat parent={parent} navigate={navigate} isMobile={isMobile}/>}
      </div>
    </div>
  );
}

function ParentsList({ active, navigate, isMobile }) {
  const [q, setQ] = useState_S('');
  const [filter, setFilter] = useState_S('all'); // all | unread | linked

  let list = window.D.PARENTS;
  if (filter === 'unread') list = list.filter(p => p.unread > 0);
  if (filter === 'linked') list = list.filter(p => p.lineLinked);
  if (q) list = list.filter(p => p.name.includes(q));

  return (
    <div className="parents-list-pane">
      <div className="parents-search">
        <div className="search-box">{window.ICONS.search}<input value={q} onChange={e => setQ(e.target.value)} placeholder="ค้นหาผู้ปกครอง"/></div>
        <div className="filter-tabs">
          <button className={filter==='all'?'active':''} onClick={() => setFilter('all')}>ทั้งหมด</button>
          <button className={filter==='unread'?'active':''} onClick={() => setFilter('unread')}>ยังไม่อ่าน</button>
          <button className={filter==='linked'?'active':''} onClick={() => setFilter('linked')}>เชื่อม LINE</button>
        </div>
      </div>
      <div className="parents-list scroll-y">
        {list.map(p => {
          const student = window.D.getStudent(p.studentId);
          return (
            <div key={p.id} className={`chat-list-row ${active === p.id ? 'active' : ''}`} onClick={() => navigate('parents', { id: p.id })}>
              <div className="avatar-sm" style={{ width: 44, height: 44, fontSize: 16, background: 'var(--accent)', position: 'relative' }}>
                {p.name.charAt(p.name.search(/[ก-ฮ]/))}
                {p.lineLinked && <span style={{ position: 'absolute', bottom: -2, right: -2, width: 14, height: 14, borderRadius: '50%', background: 'var(--line)', border: '2px solid var(--surface)' }}/>}
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="chat-list-h">
                  <span style={{ fontSize: 14, fontWeight: 600 }}>{p.name}</span>
                  <span className="chat-list-time tnum">{p.snippet_time}</span>
                </div>
                <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 1 }}>
                  {p.relation}ของ {student?.prefix}{student?.fname}

                <div className="chat-list-snippet">
                  {p.lastMessage}
                  {p.unread > 0 && <span className="chat-unread tnum">{p.unread}</span>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ParentChat({ parent, navigate, isMobile }) {
  const [text, setText] = useState_S('');
  const [messages, setMessages] = useState_S(() => window.D.CHATS[parent.id] || [
    { kind: 'date', text: 'วันนี้' },
    { from: 'system', text: '— ยังไม่เคยส่งข้อความถึงผู้ปกครองรายนี้ —' },

  const student = window.D.getStudent(parent.studentId);
  const bodyRef = useRef_S(null);

  useEffect_S(() => {
    setMessages(window.D.CHATS[parent.id] || [
      { kind: 'date', text: 'วันนี้' },
      { from: 'system', text: '— ยังไม่เคยส่งข้อความถึงผู้ปกครองรายนี้ —' },
    ]);
  }, [parent.id]);

  useEffect_S(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [messages]);

  const send = () => {
    if (!text.trim()) return;
    const newMsg = { from: 'out', text: text.trim(), time: 'เพิ่งส่ง' };
    setMessages([...messages, newMsg]);
    setText('');
  };

  const suggestions = [
    'ขอบคุณที่แจ้งค่ะ ดูแลน้องด้วยนะคะ',
    'มีอะไรให้ครูช่วยเหลือไหมคะ',
    'ส่งใบรับรองแพทย์ทาง LINE ได้เลยค่ะ',
  ];

  return (
    <div className="parents-chat-pane">
      <div className="chat-head">
        {isMobile && <button className="back-btn" onClick={() => navigate('parents')}>{window.ICONS.chevL}</button>}
        <div className="avatar-sm" style={{ width: 36, height: 36, fontSize: 13, background: 'var(--accent)' }}>{parent.name.charAt(parent.name.search(/[ก-ฮ]/))}</div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 600 }}>{parent.name}</div>
          <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>

          </div>
        </div>

      </div>

      <div className="chat-body" ref={bodyRef}>
        {messages.map((m, i) => {
          if (m.kind === 'date') return <div className="chat-date" key={i}>{m.text}</div>;
          if (m.from === 'system') return <div className="chat-system" key={i}>{m.text}</div>;
          if (m.from === 'system-ai') return <div className="chat-system ai" key={i}>{window.ICONS.sparkle} {m.text}</div>;
          return (
            <div className={`chat-msg ${m.from}`} key={i}>
              {m.text}
              {m.time && <div className="chat-time tnum">{m.time}</div>}
            </div>
          );
        })}
      </div>
      <div className="chat-suggest">
        <div className="lab">{window.ICONS.sparkle} AI แนะนำ</div>
        <div className="chips">
          {suggestions.map((s, i) => <button key={i} onClick={() => setText(s)}>{s}</button>)}
        </div>
      </div>
      <div className="chat-input">
        <textarea value={text} onChange={e => setText(e.target.value)} placeholder="พิมพ์ข้อความ…"
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}/>
        <button className="chat-send" onClick={send} disabled={!text.trim()}>{window.ICONS.send}</button>
      </div>
    </div>
  );
}

  <script type="text/babel">
// app.jsx — main App + routing + session
const { useState: useState_A, useEffect: useEffect_A } = React;

function App() {
  const [session, login, logout] = window.useSession();
  const [route, navigate] = window.useHashRoute('home');
  const [theme, setTheme] = window.useTheme();
  const [moreOpen, setMoreOpen] = useState_A(false);
  const isMobile = window.useMediaQuery('(max-width: 1023px)');

  // Page registry
  const PAGES = {
    home:          window.HomePage,
    dashboard:     window.DashboardPage,
    attendance:    window.AttendancePage,
    students:      window.StudentsPage,
    classrooms:    window.ClassroomsPage,
    parents:       window.ParentsPage,
    reports:       window.ReportsPage,
    notifications: window.NotificationsPage,
    settings:      window.SettingsPage,
  };

  // No session → show login
  if (!session) {
    return <window.LoginPage onLogin={login}/>;
  }

  const Page = PAGES[route.path] || PAGES.home;
  const navItem = window.NAV_ITEMS.find(n => n.key === route.path);
  const isFullscreenMobile = isMobile && navItem?.mobileFullscreen;
  const pageTitle = navItem?.label || 'หน้าหลัก';

  return (
    <div className={`app-shell ${isMobile ? 'is-mobile' : ''}`}>
      {!isMobile && (
        <Sidebar route={route} navigate={navigate} theme={theme} setTheme={setTheme} user={session} onLogout={logout}/>
      )}

      <div className="main-col">
        {isMobile && !isFullscreenMobile && route.path !== 'home' && (
          <MobileTopBar title={pageTitle} onOpenMore={() => setMoreOpen(true)}/>
        )}
        {isMobile && route.path === 'home' && (
          <MobileTopBar title={window.D.SCHOOL.short} onOpenMore={() => setMoreOpen(true)}/>
        )}

        {!isMobile && (
          <div className="page-topbar">
            <div className="crumb">
              {navItem?.sec || ''} · <strong>{navItem?.label || 'หน้าหลัก'}</strong>
            </div>
            <div className="right">
              <div className="page-topbar-search">
                <span style={{ color: 'var(--text-subtle)', display: 'flex' }}>{window.ICONS.search}</span>
                <input placeholder="ค้นหานักเรียน, ห้อง, ครู…"/>
              </div>
              <button className="page-topbar-icon-btn" onClick={() => navigate('notifications')} style={{ position: 'relative' }}>
                {window.ICONS.bell}
                <span style={{ position: 'absolute', top: 6, right: 6, width: 8, height: 8, background: 'var(--absent)', borderRadius: '50%', border: '2px solid var(--surface-2)' }}/>
              </button>
            </div>
          </div>
        )}

        <main className="main-content scroll-y">
          <Page navigate={navigate} route={route} isMobile={isMobile} user={session}/>
        </main>

        {isMobile && !isFullscreenMobile && (
          <MobileBottomNav route={route} navigate={navigate}/>
        )}
      </div>

      <MoreSheet open={moreOpen} onClose={() => setMoreOpen(false)} navigate={navigate} route={route}
        theme={theme} setTheme={setTheme} user={session} onLogout={logout}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
